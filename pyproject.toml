[project]
name = "battle-ranker"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.156.4",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "aiosqlite>=0.22.1",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "pip-audit>=2.10.1",
    "httpx2>=2.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
cache_dir = ".cache/pytest"

[tool.ruff]
cache-dir = ".cache/ruff"
