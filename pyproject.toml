[project]
name = "battle-ranker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.26",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "ruff>=0.15.12",
    "pip-audit>=2.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
