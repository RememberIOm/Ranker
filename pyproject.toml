[project]
name = "battle-ranker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "aiosqlite>=0.22.1",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "pip-audit>=2.10.1",
    "httpx2>=2.13.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
cache_dir = ".cache/pytest"

[tool.ruff]
cache-dir = ".cache/ruff"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
]
