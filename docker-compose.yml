services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app          # 소스코드 마운트 (hot reload)
      - /app/.venv      # venv는 컨테이너 내부 것 사용
      - ranker_data:/data  # 세션 데이터 영속
    environment:
      - DATABASE_PATH=/data/ranker.db

  tailwind:
    image: node:26.13.0-alpine@sha256:8996bb5821d62a8fd9bb27c1cb07462f3fdce6e47d640c6a881ead0b064ce216
    working_dir: /app
    volumes:
      - .:/app                          # 소스코드 공유 (output.css를 호스트에 직접 기록)
      - tailwind_modules:/app/node_modules  # node_modules는 Docker 볼륨으로 격리 (호스트 미노출)
    command: >
      sh -c "npm ci &&
             npm run build:css:watch"

volumes:
  ranker_data:
  tailwind_modules:
