{% from "partials/_icons.html" import icon %}<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ranker{% endblock %}</title>
  <script>
    // FOUC guard: apply dark theme before first paint
    (function () {
      try {
        var t = localStorage.getItem('color-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* storage unavailable */ }
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c3aed'/%3E%3Cpath d='M9 23 23 9M9 9l5.5 5.5M18 18l5 5' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/output.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body class="flex min-h-dvh flex-col bg-zinc-50 font-sans text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">

  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[130] focus:rounded-xl focus:bg-violet-600 focus:px-4 focus:py-3 focus:text-sm focus:font-bold focus:text-white focus:shadow-lg">메인 콘텐츠로 건너뛰기</a>

  <header class="sticky top-0 z-40 border-b border-zinc-200/70 bg-zinc-50/85 backdrop-blur-md dark:border-zinc-800/70 dark:bg-zinc-950/85">
    <nav aria-label="메인 네비게이션" class="mx-auto w-full max-w-6xl px-4 sm:px-6">
      <div class="flex h-16 items-center justify-between gap-2">
        <a href="/" class="flex items-center gap-2 font-display text-xl font-extrabold tracking-tight text-zinc-900 dark:text-white">
          <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-violet-600 to-fuchsia-600 text-white shadow-sm">{{ icon('swords', 'w-4.5 h-4.5') }}</span>
          <span>Ranker</span>
        </a>
        <div id="desktop-nav" class="hidden items-center gap-1 md:flex">
          <a href="/battle" data-path="/battle" class="nav-link">Battle</a>
          <a href="/ranking" data-path="/ranking" class="nav-link">Ranking</a>
          <a href="/manage" data-path="/manage" class="nav-link">Manage</a>
        </div>
        <div class="flex items-center gap-1">
          <button type="button" id="theme-toggle" class="icon-btn" aria-label="테마 전환" title="테마 전환">
            <svg id="theme-toggle-light-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="hidden w-5 h-5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg id="theme-toggle-dark-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="hidden w-5 h-5" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
          <form id="end-session-form" action="/end-session" method="post">
            <button type="submit" class="icon-btn" aria-label="세션 종료" title="세션 종료">{{ icon('logout') }}</button>
          </form>
        </div>
      </div>
      <div id="mobile-nav" class="flex items-center gap-1 pb-2 md:hidden">
        <a href="/battle" data-path="/battle" class="nav-link flex-1 justify-center">Battle</a>
        <a href="/ranking" data-path="/ranking" class="nav-link flex-1 justify-center">Ranking</a>
        <a href="/manage" data-path="/manage" class="nav-link flex-1 justify-center">Manage</a>
      </div>
    </nav>
  </header>

  <main id="main" tabindex="-1" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-zinc-200/70 py-6 text-center text-xs text-zinc-500 dark:border-zinc-800/70 dark:text-zinc-500">
    &copy; 2025&ndash;2026 Ranker. All rights reserved.
  </footer>

  <div id="toast-container" role="status" aria-live="polite" class="pointer-events-none fixed top-20 right-4 z-[110] flex flex-col items-end gap-2"></div>

  <script>
    /* ============ theme toggle ============ */
    (function () {
      var btn = document.getElementById('theme-toggle');
      var lightIcon = document.getElementById('theme-toggle-light-icon');
      var darkIcon = document.getElementById('theme-toggle-dark-icon');
      function syncIcons() {
        var isDark = document.documentElement.classList.contains('dark');
        lightIcon.classList.toggle('hidden', !isDark);
        darkIcon.classList.toggle('hidden', isDark);
      }
      syncIcons();
      btn.addEventListener('click', function () {
        var isDark = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem('color-theme', isDark ? 'dark' : 'light'); } catch (e) {}
        syncIcons();
        window.dispatchEvent(new Event('theme-changed'));
      });
    })();

    /* ============ active nav marking ============ */
    (function () {
      document.querySelectorAll('#desktop-nav a[data-path], #mobile-nav a[data-path]').forEach(function (a) {
        if (location.pathname.indexOf(a.dataset.path) === 0) a.classList.add('nav-active');
      });
    })();

    /* ============ toast system ============ */
    function showToast(message, type, duration) {
      type = type || 'info';
      duration = duration || 3000;
      var container = document.getElementById('toast-container');
      if (!container) return;
      var el = document.createElement('div');
      el.setAttribute('role', 'alert');
      el.className = 'toast animate-toast-in toast-' + (['success', 'error', 'warning', 'info'].indexOf(type) >= 0 ? type : 'info');
      el.textContent = message;
      container.appendChild(el);
      setTimeout(function () {
        el.classList.remove('animate-toast-in');
        el.classList.add('animate-toast-out');
        el.addEventListener('animationend', function () { el.remove(); }, { once: true });
        setTimeout(function () { el.remove(); }, 500); // fallback
      }, duration);
    }

    /* ============ custom confirm dialog ============ */
    function showConfirm(message, onConfirm) {
      var previouslyFocused = document.activeElement;
      var overlay = document.createElement('div');
      overlay.className = 'fixed inset-0 z-[120] flex items-center justify-center bg-zinc-950/60 p-4 backdrop-blur-sm animate-fade-in';
      overlay.innerHTML =
        '<div role="alertdialog" aria-modal="true" aria-label="확인" class="card w-full max-w-sm p-6 animate-bounce-in">' +
          '<p class="whitespace-pre-line text-sm leading-relaxed text-zinc-800 dark:text-zinc-200"></p>' +
          '<div class="mt-6 flex justify-end gap-2">' +
            '<button type="button" data-confirm-cancel class="btn-secondary">취소</button>' +
            '<button type="button" data-confirm-ok class="btn-primary">확인</button>' +
          '</div>' +
        '</div>';
      overlay.querySelector('p').textContent = message;
      var cancelBtn = overlay.querySelector('[data-confirm-cancel]');
      var okBtn = overlay.querySelector('[data-confirm-ok]');

      function close() {
        document.removeEventListener('keydown', onKey, true);
        overlay.remove();
        if (previouslyFocused && previouslyFocused.focus) previouslyFocused.focus();
      }
      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); close(); return; }
        if (e.key === 'Tab') {
          // two-element focus trap
          e.preventDefault();
          (document.activeElement === okBtn ? cancelBtn : okBtn).focus();
        }
      }
      overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) close(); });
      cancelBtn.addEventListener('click', close);
      okBtn.addEventListener('click', function () { onConfirm(); close(); });
      document.addEventListener('keydown', onKey, true);
      document.body.appendChild(overlay);
      okBtn.focus();
    }

    /* ============ session end confirm ============ */
    (function () {
      var form = document.getElementById('end-session-form');
      form.addEventListener('submit', function (e) {
        if (form.dataset.confirmed) return;
        e.preventDefault();
        showConfirm('세션을 종료하시겠습니까?\n데이터를 보존하려면 먼저 Manage → Data → Export로 저장해주세요.', function () {
          form.dataset.confirmed = 'true';
          form.submit();
        });
      });
    })();

    /* ============ fetch with timeout ============ */
    async function fetchWithTimeout(url, options, timeoutMs) {
      options = options || {};
      timeoutMs = timeoutMs || 15000;
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, timeoutMs);
      try {
        return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
      } catch (err) {
        if (err && err.name === 'AbortError') {
          throw new Error('서버 응답이 너무 오래 걸립니다. 잠시 후 다시 시도해주세요.');
        }
        throw err;
      } finally {
        clearTimeout(timer);
      }
    }

    /* ============ global HTMX handlers ============ */
    (function () {
      function hxTargetOf(evt) {
        var elt = evt.detail && evt.detail.elt;
        if (!elt || !elt.getAttribute) return null;
        var sel = elt.getAttribute('hx-target');
        if (!sel || sel === 'none') return null;
        try {
          if (sel === 'this') return elt;
          if (sel.indexOf('closest ') === 0) return elt.closest(sel.slice(8));
          if (sel.indexOf('find ') === 0) return elt.querySelector(sel.slice(5));
          return document.querySelector(sel);
        } catch (e) { return null; }
      }
      document.body.addEventListener('htmx:responseError', function (evt) {
        var xhr = evt.detail.xhr;
        if (xhr.status === 401) {
          showToast('세션이 만료되었습니다. 새로고침합니다...', 'warning', 3000);
          setTimeout(function () { location.reload(); }, 1500);
          return;
        }
        if (xhr.status === 409) {
          showToast('대결이 만료되었습니다. 새로고침합니다...', 'warning', 3000);
          setTimeout(function () { location.reload(); }, 1500);
          return;
        }
        var msg = '오류가 발생했습니다.';
        try {
          var data = JSON.parse(xhr.responseText);
          if (data && typeof data.detail === 'string') msg = data.detail;
        } catch (e) {}
        showToast(msg, 'error', 5000);
      });
      document.body.addEventListener('htmx:confirm', function (evt) {
        if (!evt.detail.question) return;
        evt.preventDefault();
        showConfirm(evt.detail.question, function () { evt.detail.issueRequest(true); });
      });
      document.body.addEventListener('showToast', function (evt) {
        var d = evt.detail || {};
        showToast(d.message || d.value || '완료', d.type || 'success');
      });
      document.body.addEventListener('htmx:beforeRequest', function (evt) {
        var t = hxTargetOf(evt);
        if (t) t.setAttribute('aria-busy', 'true');
      });
      document.body.addEventListener('htmx:afterRequest', function (evt) {
        var t = hxTargetOf(evt);
        if (t) t.removeAttribute('aria-busy');
      });
    })();
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
