{% extends "base.html" %}

{% block content %}
<div id="battle-arena" aria-live="polite">
    {% include "partials/battle_3way_cards.html" %}
</div>
<div id="result-modal-container"></div>

<style>
    /* 3-way 선택 상태 — 색상이 모드별로 다르므로 페이지 로컬 유지 */
    .vote-btn.selected-best {
        background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(34, 197, 94, 0.05));
        box-shadow: inset 0 0 0 2px rgba(34, 197, 94, 0.5);
    }
    .dark .vote-btn.selected-best {
        background: linear-gradient(135deg, rgba(34, 197, 94, 0.25), rgba(34, 197, 94, 0.1));
    }
    .vote-btn.selected-worst {
        background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.05));
        box-shadow: inset 0 0 0 2px rgba(239, 68, 68, 0.5);
    }
    .dark .vote-btn.selected-worst {
        background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(239, 68, 68, 0.1));
    }
    .vote-btn.selected-middle {
        background: linear-gradient(135deg, rgba(156, 163, 175, 0.15), rgba(156, 163, 175, 0.05));
        box-shadow: inset 0 0 0 2px rgba(156, 163, 175, 0.3);
    }
    .dark .vote-btn.selected-middle {
        background: linear-gradient(135deg, rgba(156, 163, 175, 0.2), rgba(156, 163, 175, 0.1));
    }
    .vote-btn.selected-tied {
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(245, 158, 11, 0.04));
        box-shadow: inset 0 0 0 2px rgba(245, 158, 11, 0.35);
    }
    .dark .vote-btn.selected-tied {
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.08));
    }
    .criteria-card.voted {
        border-color: rgba(34, 197, 94, 0.3);
    }
    .dark .criteria-card.voted {
        border-color: rgba(34, 197, 94, 0.4);
    }

    /* role-icon: hidden 시에도 공간 유지 + opacity 전환 */
    .vote-btn .role-icon {
        display: block !important;
        min-height: 1rem;
        opacity: 0;
        transition: opacity 0.15s ease;
    }
    .vote-btn .role-icon:not(.hidden) {
        opacity: 1;
    }

    /* '셋 다 비슷' 모드 활성 표시 — JS가 all-tied-btn에 토글 */
    .active-mode {
        background-color: #fef3c7;
        color: #b45309;
    }
    .dark .active-mode {
        background-color: rgb(120 53 15 / 0.4);
        color: #fcd34d;
    }
</style>

{% endblock %}

{% block scripts %}
<script>
    // 제출 버튼 + 역할 아이콘 SVG 라벨 (partial 마크업과 일치)
    const SUBMIT_BTN_LABEL = '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M14.5 17.5 4 7V4h3l10.5 10.5"/><path stroke-linecap="round" stroke-linejoin="round" d="M13 19l3-3m4 4-3-3m3 1 1.5-1.5"/><path stroke-linecap="round" stroke-linejoin="round" d="M16 4h3v3L9 17m-2 2-3-3m1 3 1.5-1.5"/></svg> 결과 확인';
    const ICON_SVG_ATTR = 'class="w-3.5 h-3.5 inline-block align-[-2px]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"';
    const ROLE_BEST   = `<svg ${ICON_SVG_ATTR}><path stroke-linecap="round" stroke-linejoin="round" d="M3 7l4 3 5-6 5 6 4-3-2 11H5L3 7z"/></svg> Best`;
    const ROLE_WORST  = `<svg ${ICON_SVG_ATTR}><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 13.5 12 21m0 0-7.5-7.5M12 21V3"/></svg> Worst`;
    const ROLE_MIDDLE = `<svg ${ICON_SVG_ATTR}><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14"/></svg> Middle`;
    const ROLE_TIED   = `<svg ${ICON_SVG_ATTR}><path stroke-linecap="round" stroke-linejoin="round" d="M3 9c2 -2 4 -2 6 0c2 2 4 2 6 0c2 -2 4 -2 6 0"/><path stroke-linecap="round" stroke-linejoin="round" d="M3 15c2 -2 4 -2 6 0c2 2 4 2 6 0c2 -2 4 -2 6 0"/></svg> Tied`;

    // --- State (let — reinit 시 재할당 필요) ---
    let item1Id = {{ item1.id }};
    let item2Id = {{ item2.id }};
    let item3Id = {{ item3.id }};
    let allItemIds = [item1Id, item2Id, item3Id];
    let roundToken = {{ round_token | tojson }};
    let redirectTo = {% if focus_mode %}{{ ("/battle/focus/" ~ focus_id) | tojson }}{% else %}""{% endif %};
    const criteriaKeys = {{ criteria_info | map(attribute='key') | list | tojson }};
    let totalCriteria = criteriaKeys.length;

    const votes = {};
    let isSubmitting = false;

    // --- Vote Selection ---
    function selectItem(key, itemId) {
        if (!votes[key]) votes[key] = {};
        const v = votes[key];

        if (v.allTied) {
            votes[key] = {};
            const fresh = votes[key];
            fresh.best = itemId;
            updateCardUI(key);
            return;
        }
        if (v.worstOnly) {
            const oldWorst = v.worst;
            votes[key] = { best: itemId };
            updateCardUI(key);
            return;
        }
        if (v.tied) v.tied = false;

        if (v.best === itemId) {
            delete v.best;
            updateCardUI(key);
            return;
        }
        if (v.worst === itemId) {
            delete v.worst;
            updateCardUI(key);
            return;
        }

        if (!v.best) {
            v.best = itemId;
        } else if (!v.worst) {
            v.worst = itemId;
        } else {
            v.worst = itemId;
        }

        updateCardUI(key);
    }

    function toggleTied(key) {
        if (!votes[key]) return;
        const v = votes[key];
        if (!v.best) return;

        if (v.tied) {
            v.tied = false;
        } else {
            delete v.worst;
            v.tied = true;
        }
        updateCardUI(key);
    }

    function toggleWorstOnly(key) {
        if (!votes[key]) return;
        const v = votes[key];
        if (!v.best) return;

        if (v.worstOnly) {
            const worstId = v.worst;
            votes[key] = { best: worstId };
        } else {
            const bestId = v.best;
            votes[key] = { worst: bestId, tied: true, worstOnly: true };
        }
        updateCardUI(key);
    }

    function toggleAllTied(key) {
        if (!votes[key]) votes[key] = {};
        const v = votes[key];

        if (v.allTied) {
            delete votes[key];
            votes[key] = {};
        } else {
            votes[key] = { allTied: true };
        }
        updateCardUI(key);
    }

    function updateCardUI(key) {
        const v = votes[key] || {};

        allItemIds.forEach(id => {
            const btn = document.getElementById(`btn-${key}-${id}`);
            btn.classList.remove('selected-best', 'selected-worst', 'selected-middle', 'selected-tied');
            btn.setAttribute('aria-pressed', 'false');

            const icon = btn.querySelector(`.role-icon[data-item="${id}"]`);
            if (icon) {
                icon.classList.add('hidden');
                icon.innerHTML = '';
            }
        });

        const card = document.querySelector(`.criteria-card[data-key="${key}"]`);
        const tiedBtn = document.getElementById(`tied-btn-${key}`);
        const worstOnlyBtn = document.getElementById(`worst-only-btn-${key}`);
        const allTiedBtn = document.getElementById(`all-tied-btn-${key}`);

        tiedBtn.classList.add('hidden');
        worstOnlyBtn.classList.add('hidden');

        if (v.allTied) {
            allItemIds.forEach(id => {
                const btn = document.getElementById(`btn-${key}-${id}`);
                btn.classList.add('selected-tied');
                const icon = btn.querySelector(`.role-icon[data-item="${id}"]`);
                if (icon) { icon.classList.remove('hidden'); icon.innerHTML = ROLE_TIED; }
            });
            card.classList.add('voted');
            allTiedBtn.classList.add('active-mode');
        } else if (v.worstOnly && v.worst) {
            const worstBtn = document.getElementById(`btn-${key}-${v.worst}`);
            worstBtn.classList.add('selected-worst');
            worstBtn.setAttribute('aria-pressed', 'true');
            const worstIcon = worstBtn.querySelector(`.role-icon[data-item="${v.worst}"]`);
            if (worstIcon) { worstIcon.classList.remove('hidden'); worstIcon.innerHTML = ROLE_WORST; }

            allItemIds.filter(id => id !== v.worst).forEach(id => {
                const btn = document.getElementById(`btn-${key}-${id}`);
                btn.classList.add('selected-tied');
                const icon = btn.querySelector(`.role-icon[data-item="${id}"]`);
                if (icon) { icon.classList.remove('hidden'); icon.innerHTML = ROLE_TIED; }
            });
            card.classList.add('voted');
            allTiedBtn.classList.remove('active-mode');
        } else if (v.best && v.tied) {
            const bestBtn = document.getElementById(`btn-${key}-${v.best}`);
            bestBtn.classList.add('selected-best');
            bestBtn.setAttribute('aria-pressed', 'true');
            const bestIcon = bestBtn.querySelector(`.role-icon[data-item="${v.best}"]`);
            if (bestIcon) { bestIcon.classList.remove('hidden'); bestIcon.innerHTML = ROLE_BEST; }

            allItemIds.filter(id => id !== v.best).forEach(id => {
                const btn = document.getElementById(`btn-${key}-${id}`);
                btn.classList.add('selected-tied');
                const icon = btn.querySelector(`.role-icon[data-item="${id}"]`);
                if (icon) { icon.classList.remove('hidden'); icon.innerHTML = ROLE_TIED; }
            });
            card.classList.add('voted');
            allTiedBtn.classList.remove('active-mode');
        } else if (v.best && v.worst) {
            const middleId = allItemIds.find(id => id !== v.best && id !== v.worst);

            const bestBtn = document.getElementById(`btn-${key}-${v.best}`);
            bestBtn.classList.add('selected-best');
            bestBtn.setAttribute('aria-pressed', 'true');
            const bestIcon = bestBtn.querySelector(`.role-icon[data-item="${v.best}"]`);
            if (bestIcon) { bestIcon.classList.remove('hidden'); bestIcon.innerHTML = ROLE_BEST; }

            const worstBtn = document.getElementById(`btn-${key}-${v.worst}`);
            worstBtn.classList.add('selected-worst');
            worstBtn.setAttribute('aria-pressed', 'true');
            const worstIcon = worstBtn.querySelector(`.role-icon[data-item="${v.worst}"]`);
            if (worstIcon) { worstIcon.classList.remove('hidden'); worstIcon.innerHTML = ROLE_WORST; }

            const midBtn = document.getElementById(`btn-${key}-${middleId}`);
            midBtn.classList.add('selected-middle');
            const midIcon = midBtn.querySelector(`.role-icon[data-item="${middleId}"]`);
            if (midIcon) { midIcon.classList.remove('hidden'); midIcon.innerHTML = ROLE_MIDDLE; }

            card.classList.add('voted');
            allTiedBtn.classList.remove('active-mode');
        } else {
            card.classList.remove('voted');
            allTiedBtn.classList.remove('active-mode');

            if (v.best) {
                const bestBtn = document.getElementById(`btn-${key}-${v.best}`);
                bestBtn.classList.add('selected-best');
                bestBtn.setAttribute('aria-pressed', 'true');
                const bestIcon = bestBtn.querySelector(`.role-icon[data-item="${v.best}"]`);
                if (bestIcon) { bestIcon.classList.remove('hidden'); bestIcon.innerHTML = ROLE_BEST; }
                tiedBtn.classList.remove('hidden');
                worstOnlyBtn.classList.remove('hidden');
            }
            if (v.worst) {
                const worstBtn = document.getElementById(`btn-${key}-${v.worst}`);
                worstBtn.classList.add('selected-worst');
                worstBtn.setAttribute('aria-pressed', 'true');
                const worstIcon = worstBtn.querySelector(`.role-icon[data-item="${v.worst}"]`);
                if (worstIcon) { worstIcon.classList.remove('hidden'); worstIcon.innerHTML = ROLE_WORST; }
            }
        }

        updateProgress();
    }

    function quickBest(bestId) {
        const others = allItemIds.filter(id => id !== bestId);
        criteriaKeys.forEach(key => {
            votes[key] = { best: bestId, worst: others[others.length - 1] };
            updateCardUI(key);
        });
    }

    function quickAllTied() {
        criteriaKeys.forEach(key => {
            votes[key] = { allTied: true };
            updateCardUI(key);
        });
    }

    function clearAll() {
        criteriaKeys.forEach(key => {
            delete votes[key];
            updateCardUI(key);
        });
    }

    // --- Helpers ---
    function isVoteComplete(key) {
        const v = votes[key];
        if (!v) return false;
        if (v.allTied) return true;
        if (v.worstOnly && v.worst) return true;
        if (!v.best) return false;
        return !!(v.worst || v.tied);
    }

    // --- Progress ---
    function updateProgress() {
        const count = criteriaKeys.filter(isVoteComplete).length;
        const pct = count / totalCriteria;
        const ring = document.getElementById('progress-ring');
        ring.style.strokeDashoffset = 87.96 * (1 - pct);
        ring.closest('[role="progressbar"]').setAttribute('aria-valuenow', count);
        document.getElementById('progress-count').textContent = `${count}/${totalCriteria}`;

        const label = document.getElementById('progress-label');
        if (count === 0) label.textContent = '각 기준에서 Best/Worst를 선택하세요';
        else if (count < totalCriteria) label.textContent = `${totalCriteria - count}개 남았습니다`;
        else label.textContent = '모든 기준 선택 완료!';

        const btn = document.getElementById('submit-btn');
        if (count === totalCriteria) {
            btn.disabled = false;
            btn.className = 'px-8 py-3 rounded-xl font-bold text-white shadow-lg transition-all duration-300 bg-gradient-to-r from-brand-600 via-amber-500 to-pink-500 hover:from-brand-700 hover:via-amber-600 hover:to-pink-600 cursor-pointer transform hover:scale-105 active:scale-95';
        } else {
            btn.disabled = true;
            btn.className = 'px-8 py-3 rounded-xl font-bold text-white shadow-lg transition-all duration-300 bg-gray-300 dark:bg-gray-600 cursor-not-allowed';
        }
    }

    // --- Submit ---
    async function submitAllVotes() {
        const completed = criteriaKeys.filter(isVoteComplete).length;
        if (completed < totalCriteria || isSubmitting) return;
        isSubmitting = true;
        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin mr-2"></span>처리 중...';

        const serverVotes = {};
        criteriaKeys.forEach(key => {
            const v = votes[key];
            serverVotes[key] = {};

            if (v.allTied) {
                allItemIds.forEach(id => {
                    serverVotes[key][String(id)] = 'tied';
                });
            } else if (v.worstOnly && v.worst) {
                serverVotes[key][String(v.worst)] = 'worst';
                allItemIds.filter(id => id !== v.worst).forEach(id => {
                    serverVotes[key][String(id)] = 'tied';
                });
            } else if (v.tied) {
                serverVotes[key][String(v.best)] = 'best';
                allItemIds.filter(id => id !== v.best).forEach(id => {
                    serverVotes[key][String(id)] = 'tied';
                });
            } else {
                serverVotes[key][String(v.best)] = 'best';
                serverVotes[key][String(v.worst)] = 'worst';
            }
        });

        try {
            const res = await fetchWithTimeout('/battle/vote/3way', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'HX-Request': 'true',
                },
                body: JSON.stringify({
                    item1_id: item1Id,
                    item2_id: item2Id,
                    item3_id: item3Id,
                    round_token: roundToken,
                    votes: serverVotes,
                    redirect_to: redirectTo || null,
                }),
            });

            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                handleVoteError(res.status, data);
                return;
            }

            const html = await res.text();
            const container = document.getElementById('result-modal-container');
            const temp = document.createElement('div');
            temp.innerHTML = html;

            temp.querySelectorAll('[hx-swap-oob]').forEach(oob => {
                const target = document.getElementById(oob.id);
                if (target) target.innerHTML = oob.innerHTML;
                oob.remove();
            });

            container.innerHTML = temp.innerHTML;
            initResultModal();
        } catch (err) {
            console.error(err);
            showToast(err.message || '투표를 저장하는 중 오류가 발생했습니다. 다시 시도해주세요.', 'error', 5000);
        } finally {
            isSubmitting = false;
            const container = document.getElementById('result-modal-container');
            if (!container.innerHTML.trim()) {
                updateProgress();
                submitBtn.innerHTML = SUBMIT_BTN_LABEL;
            }
        }
    }

    function handleVoteError(status, data) {
        const detail = typeof data?.detail === 'string'
            ? data.detail
            : typeof data?.error === 'string'
                ? data.error
                : '투표를 처리할 수 없습니다. 새로고침 후 다시 시도해주세요.';

        if (status === 401) {
            showToast('서버와의 연결이 일시적으로 끊겼습니다. 새로고침합니다...', 'warning', 3000);
            setTimeout(() => location.reload(), 1500);
            return;
        }
        if (status === 409) {
            showToast('대결이 만료되었습니다. 새로운 대결을 불러옵니다...', 'warning', 3000);
            setTimeout(() => location.reload(), 1500);
            return;
        }
        showToast(detail, 'error', 5000);
    }

    // --- Result Modal 초기화 ---
    function initResultModal() {
        const modal = document.getElementById('result-modal');
        if (!modal) return;

        const autoSkip = modal.dataset.autoSkip === 'true';
        const skipSeconds = parseFloat(modal.dataset.skipSeconds || '3');
        // prefers-reduced-motion이 활성화되면 자동 진행을 비활성화 (수동 닫기로 전환)
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const effectiveAutoSkip = autoSkip && !prefersReducedMotion;

        // 포커스 트랩 fallback용으로 모달 자체를 포커스 가능하게
        modal.setAttribute('tabindex', '-1');

        requestAnimationFrame(() => {
            modal.classList.remove('opacity-0');
            const inner = modal.querySelector(':scope > div');
            if (inner) {
                inner.classList.remove('scale-95');
                inner.classList.add('scale-100');
            }
        });

        if (effectiveAutoSkip) {
            const MODAL_ANIM_MS = 300;
            modal._progressTimer = setTimeout(() => {
                const prog = document.getElementById('modal-progress');
                if (prog) prog.style.width = '100%';
            }, MODAL_ANIM_MS + 50);
            modal._autoSkipTimer = setTimeout(dismissModal, MODAL_ANIM_MS + skipSeconds * 1000);
            modal.focus();
        } else {
            // reduced-motion으로 인해 자동이 비활성화된 경우 UI도 수동 모드로 전환
            if (autoSkip && prefersReducedMotion) {
                document.getElementById('auto-skip-area')?.classList.add('hidden');
                document.getElementById('click-skip-area')?.classList.remove('hidden');
            }
            const nextBtn = document.getElementById('next-battle-btn');
            if (nextBtn) nextBtn.focus();

            modal.addEventListener('click', function handler(e) {
                if (e.target === modal) {
                    modal.removeEventListener('click', handler);
                    dismissModal();
                }
            });
        }

        // 통합 키보드 핸들러: Escape 닫기 + Tab 포커스 트랩 + (수동 모드) Space/Enter 닫기
        function getFocusables() {
            return Array.from(modal.querySelectorAll(
                'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
            ));
        }
        modal._keyHandler = function (e) {
            if (e.key === 'Escape') {
                e.preventDefault();
                dismissModal();
                return;
            }
            if (e.key === 'Tab') {
                const focusables = getFocusables();
                if (focusables.length === 0) {
                    e.preventDefault();
                    modal.focus();
                    return;
                }
                const first = focusables[0];
                const last = focusables[focusables.length - 1];
                const active = document.activeElement;
                if (!modal.contains(active)) {
                    e.preventDefault();
                    first.focus();
                    return;
                }
                if (e.shiftKey && active === first) {
                    e.preventDefault();
                    last.focus();
                } else if (!e.shiftKey && active === last) {
                    e.preventDefault();
                    first.focus();
                }
                return;
            }
            // 자동 진행 중이 아닐 때만 Space/Enter로 닫기 (cancelAutoSkip 호출 시 _autoSkipTimer 제거됨)
            if (!modal._autoSkipTimer && (e.code === 'Space' || e.code === 'Enter')) {
                e.preventDefault();
                dismissModal();
            }
        };
        document.addEventListener('keydown', modal._keyHandler);
    }

    // 자동 스킵 취소 — "유지" 버튼이 호출, 결과를 천천히 보고 수동으로 닫기
    function cancelAutoSkip() {
        const modal = document.getElementById('result-modal');
        if (!modal) return;
        if (modal._autoSkipTimer) {
            clearTimeout(modal._autoSkipTimer);
            modal._autoSkipTimer = null;
        }
        if (modal._progressTimer) {
            clearTimeout(modal._progressTimer);
            modal._progressTimer = null;
        }
        const prog = document.getElementById('modal-progress');
        if (prog) {
            const computedWidth = getComputedStyle(prog).width;
            prog.style.transition = 'none';
            prog.style.width = computedWidth;
        }
        document.getElementById('auto-skip-area')?.classList.add('hidden');
        document.getElementById('click-skip-area')?.classList.remove('hidden');
        const nextBtn = document.getElementById('next-battle-btn');
        if (nextBtn) nextBtn.focus();
        modal.addEventListener('click', function handler(e) {
            if (e.target === modal) {
                modal.removeEventListener('click', handler);
                dismissModal();
            }
        });
    }

    function dismissModal() {
        const modal = document.getElementById('result-modal');
        if (modal) {
            if (modal._keyHandler) document.removeEventListener('keydown', modal._keyHandler);
            if (modal._autoSkipTimer) clearTimeout(modal._autoSkipTimer);
            if (modal._progressTimer) clearTimeout(modal._progressTimer);
        }
        document.getElementById('result-modal-container').innerHTML = '';
        reinitBattleState();
    }

    function reinitBattleState() {
        const state = document.getElementById('battle-state');
        if (!state) {
            window.location.href = redirectTo || '/battle';
            return;
        }

        // 새 배틀이 2-way이면 페이지 전환
        if (state.dataset.battleMode === '2way') {
            window.location.href = redirectTo || '/battle';
            return;
        }

        item1Id = parseInt(state.dataset.item1Id);
        item2Id = parseInt(state.dataset.item2Id);
        item3Id = parseInt(state.dataset.item3Id);
        allItemIds = [item1Id, item2Id, item3Id];
        roundToken = state.dataset.roundToken;
        redirectTo = state.dataset.redirectTo || '';

        criteriaKeys.length = 0;
        criteriaKeys.push(...JSON.parse(state.dataset.criteriaKeys));
        totalCriteria = criteriaKeys.length;

        Object.keys(votes).forEach(k => delete votes[k]);
        isSubmitting = false;
        updateProgress();

        // 새 배틀 카드로 포커스 이동
        const firstVoteBtn = document.querySelector('#criteria-list .vote-btn');
        if (firstVoteBtn) firstVoteBtn.focus();
    }

    // --- Keyboard shortcuts ---
    document.addEventListener('keydown', (e) => {
        if (document.getElementById('result-modal')) return;
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'Enter' && !document.getElementById('submit-btn').disabled) {
            e.preventDefault();
            submitAllVotes();
        }
    });
</script>
{% endblock %}
