{% from "partials/_icons.html" import icon %}
{% macro criteria_row(c) %}
<div class="criteria-row flex flex-col gap-4 rounded-2xl border border-zinc-200 bg-zinc-50/60 p-4 md:flex-row md:items-end dark:border-zinc-800 dark:bg-zinc-950/40">
  <input type="hidden" name="key" value="{{ c.key }}">
  <label class="block flex-1">
    <span class="field-label">이름</span>
    <input type="text" name="label" value="{{ c.label }}" required placeholder="평가 기준 이름" class="field-input">
  </label>
  <div>
    <span class="field-label">색상</span>
    <input type="hidden" name="color" value="{{ c.color }}">
    <div class="flex flex-wrap gap-1.5">
      {% for clr in ['red', 'orange', 'yellow', 'green', 'teal', 'blue', 'indigo', 'purple', 'pink', 'gray'] %}
      <button type="button" class="color-swatch bg-{{ clr }}-500 {{ 'swatch-selected' if c.color == clr }}"
              onclick="pickColor(this, '{{ clr }}')" title="{{ clr }}" aria-label="색상: {{ clr }}"
              aria-pressed="{{ 'true' if c.color == clr else 'false' }}"></button>
      {% endfor %}
    </div>
  </div>
  <label class="block">
    <span class="field-label">가중치</span>
    <input type="number" name="weight" value="{{ c.weight }}" step="0.1" min="0" required inputmode="decimal" class="field-input w-28">
  </label>
  <button type="button" class="icon-btn shrink-0 text-rose-500 hover:bg-rose-100 hover:text-rose-700 dark:text-rose-400 dark:hover:bg-rose-500/15"
          onclick="this.closest('.criteria-row').remove()" title="삭제" aria-label="기준 삭제">{{ icon('trash') }}</button>
</div>
{% endmacro %}
