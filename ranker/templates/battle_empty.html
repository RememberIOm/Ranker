{% extends "base.html" %}

{% block content %}
<section class="flex min-h-[60dvh] flex-col items-center justify-center text-center">
  <div class="animate-float text-7xl" aria-hidden="true">{{ icon }}</div>
  <h2 class="animate-slide-up mt-6 font-display text-2xl font-bold sm:text-3xl">{{ title }}</h2>
  <p class="animate-slide-up mt-3 text-sm leading-relaxed text-zinc-600 sm:text-base dark:text-zinc-400" style="animation-delay: 80ms">{{ description }}</p>
  <a href="{{ link_url }}" class="btn-primary animate-slide-up mt-8 px-8 py-3.5 text-base" style="animation-delay: 160ms">{{ link_text }}</a>
</section>
{% endblock %}
